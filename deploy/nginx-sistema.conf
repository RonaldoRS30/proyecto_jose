# ElectrixStudio — SPA en /sistema/ + API proxy
# Placeholder __PROJECT_ROOT__ se reemplaza en deploy.sh por la ruta real del proyecto.

server {
    listen 80;
    # listen 443 ssl http2;
    server_name _;

    # Compresión gzip — reduce JS/CSS ~70%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # API → Node/PM2
    location /sistema/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # JS/CSS con hash — caché 1 año
    location ^~ /sistema/assets/ {
        alias __PROJECT_ROOT__/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA (Vite base /sistema/)
    location /sistema/ {
        alias __PROJECT_ROOT__/frontend/dist/;
        try_files $uri $uri/ /sistema/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /sistema {
        return 301 /sistema/;
    }
}
